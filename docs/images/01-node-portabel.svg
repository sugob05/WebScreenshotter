<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title description">
<title id="title">Portables Node.js richtig ablegen</title><desc id="description">Windows-x64-ZIP von nodejs.org laden, entpacken und den Inhalt nach runtime/node kopieren. node.exe liegt direkt in runtime/node.</desc>
<rect width="1120" height="690" fill="#f3f7f4"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="38" y="48" font-size="31" font-weight="700" fill="#173c32">Portables Node.js richtig ablegen</text>
<text x="38" y="83" font-size="18" font-weight="400" fill="#465a53">WebScreenshotter · Schematische Bedienhilfe mit Beispielwerten</text>
<rect x="38" y="115" width="330" height="246" rx="14" fill="#ffffff" stroke="#bbcfc4" stroke-width="2"/><text x="61" y="154" font-size="20" font-weight="700" fill="#173c32">1  Offizielles ZIP laden</text><text x="61" y="189" font-size="21" font-weight="400" fill="#465a53">nodejs.org</text><text x="61" y="222" font-size="21" font-weight="400" fill="#465a53">Node.js 24 LTS</text><text x="61" y="255" font-size="21" font-weight="400" fill="#465a53">Windows · x64 · ZIP</text><text x="61" y="317" font-size="18" font-weight="600" fill="#173c32">node-v24.22.3-win-x64.zip</text><rect x="395" y="115" width="330" height="246" rx="14" fill="#ffffff" stroke="#bbcfc4" stroke-width="2"/><text x="418" y="154" font-size="20" font-weight="700" fill="#173c32">2  ZIP vollständig entpacken</text><text x="418" y="189" font-size="21" font-weight="400" fill="#465a53">Versionsordner öffnen.</text><text x="418" y="222" font-size="21" font-weight="400" fill="#465a53">Darin liegen node.exe,</text><text x="418" y="255" font-size="21" font-weight="400" fill="#465a53">npm.cmd und weitere Dateien.</text><text x="418" y="317" font-size="17" font-weight="600" fill="#173c32">Den Inhalt dieses Ordners kopieren.</text><rect x="752" y="115" width="330" height="246" rx="14" fill="#ffffff" stroke="#bbcfc4" stroke-width="2"/><text x="775" y="154" font-size="20" font-weight="700" fill="#173c32">3  In den Zielordner kopieren</text><text x="775" y="189" font-size="21" font-weight="400" fill="#465a53">WebScreenshotter öffnen.</text><text x="775" y="222" font-size="21" font-weight="400" fill="#465a53">runtime → node öffnen</text><text x="775" y="255" font-size="21" font-weight="400" fill="#465a53">und den Inhalt einfügen.</text><text x="775" y="317" font-size="16" font-weight="600" fill="#173c32">Kein zusätzlicher Versionsunterordner!</text><rect x="38" y="387" width="1044" height="100" rx="14" fill="#e6f2eb" stroke="#bbcfc4" stroke-width="2"/><text x="62" y="425" font-size="18" font-weight="700" fill="#173c32">RICHTIGER PFAD</text><text x="62" y="462" font-size="27" font-weight="600" fill="#173c32">WebScreenshotter\runtime\node\node.exe</text><rect x="38" y="510" width="1044" height="122" rx="14" fill="#ffffff" stroke="#bbcfc4" stroke-width="2"/><text x="61" y="549" font-size="25" font-weight="700" fill="#173c32">Danach: WebScreenshotter-starten.cmd doppelklicken</text><text x="61" y="594" font-size="22" font-weight="400" fill="#173c32">Node.js führt den lokalen Dienst aus. Die Oberfläche öffnet sich im Standardbrowser.</text>
<text x="38" y="666" font-size="17" font-weight="400" fill="#465a53">Die nummerierten Schritte und vollständigen Erläuterungen stehen in der README.</text>
</g></svg>
