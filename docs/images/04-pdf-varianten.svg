<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title description">
<title id="title">PDF: einzelne Dateien oder eine Gesamt-PDF</title><desc id="description">Ohne Häkchen entsteht eine PDF pro URL. Mit Häkchen entsteht nur gesamt.pdf. Die Reihenfolge der URLs bleibt erhalten, Seitenbereiche werden dokumentiert.</desc>
<rect width="1120" height="690" fill="#f3f7f4"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="38" y="48" font-size="31" font-weight="700" fill="#173c32">PDF: einzelne Dateien oder eine Gesamt-PDF</text>
<text x="38" y="83" font-size="18" font-weight="400" fill="#465a53">WebScreenshotter · Schematische Bedienhilfe mit Beispielwerten</text>
<rect x="38" y="115" width="510" height="455" rx="14" fill="#ffffff" stroke="#bbcfc4" stroke-width="2"/><text x="61" y="154" font-size="25" font-weight="700" fill="#173c32">Checkbox ausgeschaltet</text><rect x="61" y="184" width="23" height="23" rx="4" fill="#fff" stroke="#176348" stroke-width="2"/><text x="99" y="204" font-size="20" font-weight="600" fill="#173c32">Alle Aufnahmen in einer PDF</text><rect x="61" y="239" width="462" height="69" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="81" y="281" font-size="20" font-weight="400" fill="#173c32">URL 1 → screenshots/web_0001.pdf</text><rect x="61" y="328" width="462" height="69" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="81" y="370" font-size="20" font-weight="400" fill="#173c32">URL 2 → screenshots/web_0002.pdf</text><rect x="61" y="417" width="462" height="69" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="81" y="459" font-size="20" font-weight="400" fill="#173c32">URL 3 → screenshots/web_0003.pdf</text><text x="61" y="538" font-size="22" font-weight="600" fill="#173c32">Eine PDF pro aufgenommener URL.</text><rect x="572" y="115" width="510" height="455" rx="14" fill="#ffffff" stroke="#bbcfc4" stroke-width="2"/><text x="595" y="154" font-size="25" font-weight="700" fill="#173c32">Checkbox eingeschaltet</text><rect x="596" y="184" width="23" height="23" rx="4" fill="#176348" stroke="#176348" stroke-width="2"/><path d="M601 195 l5 6 l9 -13" fill="none" stroke="#fff" stroke-width="3"/><text x="634" y="204" font-size="20" font-weight="600" fill="#173c32">Alle Aufnahmen in einer PDF</text><rect x="596" y="239" width="462" height="247" rx="14" fill="#e6f2eb" stroke="#bbcfc4" stroke-width="2"/><text x="620" y="286" font-size="33" font-weight="700" fill="#173c32">gesamt.pdf</text><text x="620" y="336" font-size="23" font-weight="400" fill="#173c32">URL 1 → Seiten 1–2</text><text x="620" y="371" font-size="23" font-weight="400" fill="#173c32">URL 2 → Seiten 3–4</text><text x="620" y="406" font-size="23" font-weight="400" fill="#173c32">URL 3 → Seiten 5–6</text><text x="596" y="538" font-size="20" font-weight="600" fill="#173c32">Nur die Gesamt-PDF bleibt als Ergebnis.</text><text x="38" y="609" font-size="21" font-weight="400" fill="#173c32">Beispiel: drei URLs mit jeweils zwei Bildseiten. Seitenbereiche stehen in METS und Manifest.</text>
<text x="38" y="666" font-size="17" font-weight="400" fill="#465a53">Die nummerierten Schritte und vollständigen Erläuterungen stehen in der README.</text>
</g></svg>
