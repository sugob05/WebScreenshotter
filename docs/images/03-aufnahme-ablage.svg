<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title description">
<title id="title">Aufnahme, Pausen und Ablage einstellen</title><desc id="description">Browser und Fenstergröße bestimmen die Aufnahme. Zeitabstände werden fest oder zufällig gewählt. Zielordner, Dateiformat, Präfix, Suffix und Nummerierung bestimmen die Ablage.</desc>
<rect width="1120" height="690" fill="#f3f7f4"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="38" y="48" font-size="31" font-weight="700" fill="#173c32">Aufnahme, Pausen und Ablage einstellen</text>
<text x="38" y="83" font-size="18" font-weight="400" fill="#465a53">WebScreenshotter · Schematische Bedienhilfe mit Beispielwerten</text>
