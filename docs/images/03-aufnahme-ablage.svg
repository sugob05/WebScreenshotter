x="572" y="115" width="510" height="510" rx="14" fill="#ffffff" stroke="#bbcfc4" stroke-width="2"/><text x="595" y="154" font-size="25" font-weight="700" fill="#173c32">4  Ablage &amp; Dateinamen</text><text x="596" y="188" font-size="18" font-weight="600" fill="#173c32">Zielordner *</text><rect x="596" y="200" width="462" height="48" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="611" y="232" font-size="20" font-weight="400" fill="#173c32">C:\WebScreenshotter\aufnahmen</text><text x="596" y="278" font-size="18" font-weight="600" fill="#173c32">Speicherformat</text><rect x="596" y="290" width="462" height="48" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="611" y="322" font-size="20" font-weight="400" fill="#173c32">PNG  |  JPG  |  TIF  |  PDF</text><text x="596" y="368" font-size="18" font-weight="600" fill="#173c32">Präfix</text><rect x="596" y="380" width="218" height="48" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="611" y="412" font-size="20" font-weight="400" fill="#173c32">web_</text><text x="840" y="368" font-size="18" font-weight="600" fill="#173c32">Suffix</text><rect x="840" y="380" width="218" height="48" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="855" y="412" font-size="20" font-weight="400" fill="#173c32">_archiv</text><text x="596" y="458" font-size="18" font-weight="600" fill="#173c32">Startnummer</text><rect x="596" y="470" width="218" height="48" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="611" y="502" font-size="20" font-weight="400" fill="#173c32">7</text><text x="840" y="458" font-size="18" font-weight="600" fill="#173c32">Mindeststellen</text><rect x="840" y="470" width="218" height="48" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="855" y="502" font-size="20" font-weight="400" fill="#173c32">4</text><text x="596" y="579" font-size="24" font-weight="600" fill="#173c32">Beispiel: web_0007_archiv.png</text>
