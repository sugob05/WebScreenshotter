<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title description">
<title id="title">Browserpfade und Darstellung verwalten</title><desc id="description">Browser und Einstellungen enthält eigene Programmpfade, Browser testen, die Speicherfunktion und den Darkmode. Der Browser der Oberfläche ist unabhängig vom Aufnahme-Browser.</desc>
<rect width="1120" height="690" fill="#f3f7f4"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="38" y="48" font-size="31" font-weight="700" fill="#173c32">Browserpfade und Darstellung verwalten</text>
<text x="38" y="83" font-size="18" font-weight="400" fill="#465a53">WebScreenshotter · Schematische Bedienhilfe mit Beispielwerten</text>
<rect x="38" y="115" width="640" height="457" rx="14" fill="#ffffff" stroke="#bbcfc4" stroke-width="2"/><text x="61" y="154" font-size="25" font-weight="700" fill="#173c32">Browser &amp; Einstellungen</text><text x="61" y="193" font-size="27" font-weight="700" fill="#173c32">Microsoft Edge</text><text x="61" y="241" font-size="18" font-weight="600" fill="#173c32">Eigener Programmpfad für Microsoft Edge</text><rect x="61" y="253" width="594" height="48" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="76" y="285" font-size="20" font-weight="400" fill="#173c32">Leer lassen = automatisch erkennen</text><text x="61" y="337" font-size="21" font-weight="400" fill="#173c32">Den verfügbaren Aufnahme-Browser hier prüfen.</text><rect x="61" y="372" width="208" height="49" rx="14" fill="#176348" stroke="#176348" stroke-width="2"/><text x="77" y="404" font-size="20" font-weight="600" fill="#fff">Browser testen</text><text x="61" y="467" font-size="21" font-weight="400" fill="#465a53">Eigene Pfade erst nach erfolgreichem Test</text><text x="61" y="500" font-size="21" font-weight="400" fill="#465a53">mit „Einstellungen speichern“ übernehmen.</text><rect x="702" y="115" width="380" height="457" rx="14" fill="#ffffff" stroke="#bbcfc4" stroke-width="2"/><text x="725" y="154" font-size="20" font-weight="700" fill="#173c32">Darstellung</text><text x="727" y="192" font-size="23" font-weight="700" fill="#173c32">Darkmode</text><rect x="970" y="166" width="80" height="39" rx="20" fill="#176348"/><circle cx="1030" cy="185.5" r="15" fill="#fff"/><rect x="727" y="238" width="330" height="246" rx="14" fill="#15271f" stroke="#365a48" stroke-width="2"/><text x="747" y="286" font-size="25" font-weight="700" fill="#eef8f0">WebScreenshotter</text><text x="747" y="333" font-size="22" font-weight="400" fill="#cadfd1">Dunkle Darstellung</text><text x="747" y="380" font-size="20" font-weight="400" fill="#cadfd1">Wird sofort angewendet.</text><text x="747" y="427" font-size="19" font-weight="400" fill="#cadfd1">Bleibt im Browser erhalten.</text><text x="38" y="610" font-size="21" font-weight="400" fill="#173c32">Die Oberfläche öffnet sich im Standardbrowser. Den Aufnahme-Browser wählen Sie separat.</text>
<text x="38" y="666" font-size="17" font-weight="400" fill="#465a53">Die nummerierten Schritte und vollständigen Erläuterungen stehen in der README.</text>
</g></svg>
