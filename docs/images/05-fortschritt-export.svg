<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title description">
<title id="title">Fortschritt verfolgen und Excel exportieren</title><desc id="description">Der Auftragsstatus zeigt bearbeitete URLs. Nach Abschluss bietet der Excel-Button aufnahmen.xlsx an. Bilder, METS, Manifest und Prüfsummen liegen im Auftragsordner.</desc>
<rect width="1120" height="690" fill="#f3f7f4"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="38" y="48" font-size="31" font-weight="700" fill="#173c32">Fortschritt verfolgen und Excel exportieren</text>
<text x="38" y="83" font-size="18" font-weight="400" fill="#465a53">WebScreenshotter · Schematische Bedienhilfe mit Beispielwerten</text>
<rect x="38" y="115" width="1044" height="455" rx="14" fill="#ffffff" stroke="#bbcfc4" stroke-width="2"/><text x="61" y="154" font-size="25" font-weight="700" fill="#173c32">5  Auftrag und Ergebnisse</text><text x="61" y="191" font-size="25" font-weight="700" fill="#173c32">Abgeschlossen · 3 von 3 URLs bearbeitet</text><rect x="61" y="214" width="998" height="22" rx="14" fill="#e6f2eb" stroke="#bbcfc4" stroke-width="2"/><rect x="61" y="214" width="998" height="22" rx="11" fill="#176348"/><text x="61" y="285" font-size="19" font-weight="700" fill="#173c32">URL</text><text x="705" y="285" font-size="19" font-weight="700" fill="#173c32">HTTP-Status</text><text x="895" y="285" font-size="19" font-weight="700" fill="#173c32">Ergebnis</text><text x="61" y="330" font-size="21" font-weight="400" fill="#173c32">https://example.org/</text><text x="728" y="330" font-size="21" font-weight="400" fill="#173c32">200</text><text x="895" y="330" font-size="21" font-weight="400" fill="#173c32">Aufnahme</text><text x="61" y="375" font-size="21" font-weight="400" fill="#173c32">https://example.org/kontakt</text><text x="728" y="375" font-size="21" font-weight="400" fill="#173c32">200</text><text x="895" y="375" font-size="21" font-weight="400" fill="#173c32">Aufnahme</text><text x="61" y="420" font-size="21" font-weight="400" fill="#173c32">https://example.org/fehlt</text><text x="728" y="420" font-size="21" font-weight="400" fill="#173c32">404</text><text x="895" y="420" font-size="21" font-weight="400" fill="#173c32">Warnung</text><rect x="61" y="471" width="360" height="49" rx="14" fill="#176348" stroke="#176348" stroke-width="2"/><text x="77" y="503" font-size="20" font-weight="600" fill="#fff">Als Excel exportieren (.xlsx)</text><text x="464" y="505" font-size="24" font-weight="600" fill="#173c32">→ aufnahmen.xlsx im Auftragsordner</text><text x="38" y="611" font-size="22" font-weight="400" fill="#173c32">Metadaten und Prüfsummen: mets.xml  ·  manifest.json  ·  checksums.sha256</text>
<text x="38" y="666" font-size="17" font-weight="400" fill="#465a53">Die nummerierten Schritte und vollständigen Erläuterungen stehen in der README.</text>
</g></svg>
