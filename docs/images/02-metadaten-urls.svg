<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title description">
<title id="title">Bestand beschreiben und Website-Adressen hinzufügen</title><desc id="description">Links werden Username, Bestand, Beschreibung und Signatur erfasst. Rechts stehen URLs zeilenweise; TXT-Dateien können in den URL-Bereich gezogen werden.</desc>
<rect width="1120" height="690" fill="#f3f7f4"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="38" y="48" font-size="31" font-weight="700" fill="#173c32">Bestand beschreiben und Website-Adressen hinzufügen</text>
<text x="38" y="83" font-size="18" font-weight="400" fill="#465a53">WebScreenshotter · Schematische Bedienhilfe mit Beispielwerten</text>
<rect x="38" y="115" width="510" height="510" rx="14" fill="#ffffff" stroke="#bbcfc4" stroke-width="2"/><text x="61" y="154" font-size="25" font-weight="700" fill="#173c32">1  Bestand &amp; Metadaten</text><text x="61" y="188" font-size="18" font-weight="600" fill="#173c32">Username *</text><rect x="61" y="200" width="462" height="48" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="76" y="232" font-size="20" font-weight="400" fill="#173c32">Beispielarchiv</text><text x="61" y="278" font-size="18" font-weight="600" fill="#173c32">Name des Bestands *</text><rect x="61" y="290" width="462" height="48" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="76" y="322" font-size="20" font-weight="400" fill="#173c32">Kommunale Websites 2026</text><text x="61" y="368" font-size="18" font-weight="600" fill="#173c32">Beschreibung</text><rect x="61" y="380" width="462" height="48" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="76" y="412" font-size="20" font-weight="400" fill="#173c32">Dokumentation ausgewählter Seiten</text><text x="61" y="458" font-size="18" font-weight="600" fill="#173c32">Vorläufige Signatur</text><rect x="61" y="470" width="462" height="48" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="76" y="502" font-size="20" font-weight="400" fill="#173c32">WEB-2026</text><text x="61" y="572" font-size="20" font-weight="400" fill="#173c32">Zusätzliche Dublin-Core-Felder sind möglich.</text><rect x="572" y="115" width="510" height="510" rx="14" fill="#ffffff" stroke="#bbcfc4" stroke-width="2"/><text x="595" y="154" font-size="25" font-weight="700" fill="#173c32">2  Website-Adressen</text><text x="596" y="185" font-size="21" font-weight="600" fill="#173c32">Einzelne URLs  |  XML-Sitemap</text><rect x="596" y="208" width="462" height="145" rx="14" fill="#f8faf8" stroke="#bbcfc4" stroke-width="2"/><text x="612" y="246" font-size="20" font-weight="400" fill="#465a53">https://example.org/</text><text x="612" y="278" font-size="20" font-weight="400" fill="#465a53">https://example.org/kontakt</text><text x="612" y="310" font-size="20" font-weight="400" fill="#465a53">https://example.org/geschichte</text><rect x="596" y="380" width="462" height="110" rx="14" fill="#e6f2eb" stroke="#bbcfc4" stroke-width="2"/><text x="612" y="418" font-size="20" font-weight="400" fill="#173c32">TXT-Dateien hierher ziehen</text><text x="612" y="450" font-size="20" font-weight="400" fill="#173c32">oder über die Dateiauswahl hinzufügen.</text><text x="596" y="538" font-size="19" font-weight="400" fill="#465a53">Eine vollständige URL pro Zeile.</text><text x="596" y="569" font-size="19" font-weight="400" fill="#465a53">Vorhandene URLs bleiben erhalten.</text><text x="596" y="600" font-size="19" font-weight="400" fill="#465a53">Doppelte Adressen werden entfernt.</text>
<text x="38" y="666" font-size="17" font-weight="400" fill="#465a53">Die nummerierten Schritte und vollständigen Erläuterungen stehen in der README.</text>
</g></svg>
